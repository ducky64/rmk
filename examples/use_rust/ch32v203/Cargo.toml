[package]
name = "rmk-ch32v203"
version = "0.2.0"
authors = ["Haobo Gu <haobogu@outlook.com>"]
description = "Keyboard firmware written in Rust"
homepage = "https://github.com/haobogu/rmk"
repository = "https://github.com/haobogu/rmk"
readme = "../../README.md"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
rmk = { path = "../../../rmk", default-features = false, features = ["defmt"] }

ch32-hal = { git = "https://github.com/ch32-rs/ch32-hal.git", features = [
    "ch32v203k8t6",
    "memory-x",
    "embassy",
    "rt",
    "time-driver-tim2",
], default-features = false }
qingke-rt = "0.7"
# qingke = "0.7"
# qingke = { version = "0.7", features = ["critical-section-impl"] }
qingke = { git = "https://github.com/ch32-rs/qingke.git" }

# riscv = { version = "0.16", features = ["critical-section-single-hart"] }

critical-section = "1.2"
embassy-executor = { version = "0.10", features = [
    # "platform-spin",
    "platform-riscv32",
    "executor-thread",
    "defmt",
] }

embassy-time = "0.5.1"
embassy-usb = { version = "0.5.1" }
embassy-usb-driver = "=0.2.0"
embassy-futures = { version = "0.1.2" }

defmt = "1.0"
defmt-rtt = "1.3.0"
panic-halt = "1.0"

portable-atomic = { version = "1", features = ["critical-section"] }

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[[bin]]
name = "rmk-ch32v203"
test = false
bench = false

[profile.dev]  # this will NOT fit in flash!
codegen-units = 1      # better optimizations
debug = true
strip = false
opt-level = "s"
overflow-checks = true
lto = "thin"

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
strip = false
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"
